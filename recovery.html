<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Word Recall 数据恢复扫描器</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#1f2937}
    main{max-width:820px;margin:auto;padding:18px}
    .card{background:white;border:1px solid #dfe3ea;border-radius:14px;padding:16px;margin-bottom:14px}
    h1{font-size:22px;margin:0 0 8px}
    h2{font-size:17px;margin:0 0 10px}
    p{line-height:1.55}
    button{font:inherit;padding:10px 13px;border:1px solid #cfd5df;border-radius:10px;background:white;margin:5px 5px 5px 0}
    button.primary{background:#2563eb;color:white;border-color:#2563eb}
    button.danger{background:#b91c1c;color:white;border-color:#b91c1c}
    button:disabled{opacity:.45}
    .candidate{border:1px solid #dfe3ea;border-radius:12px;padding:12px;margin:10px 0}
    .good{border-color:#16a34a;background:#f0fdf4}
    .empty{border-color:#f59e0b;background:#fffbeb}
    .bad{border-color:#dc2626;background:#fef2f2}
    .muted{color:#6b7280;font-size:13px}
    .stats{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
    .pill{padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}
    pre{white-space:pre-wrap;word-break:break-word;background:#f3f4f6;padding:10px;border-radius:8px;max-height:220px;overflow:auto}
    #status{font-weight:600}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Word Recall 数据恢复扫描器</h1>
    <p>本页面只扫描当前 GitHub Pages 域名下仍然存在的 localStorage 和 IndexedDB 数据。扫描本身不会删除或覆盖数据。</p>
    <p class="muted">必须把本文件上传到原仓库根目录，并从原来的 GitHub Pages 域名打开，否则无法访问原站点数据。</p>
    <button id="scanBtn" class="primary">开始扫描</button>
    <span id="status"></span>
  </div>

  <div class="card">
    <h2>扫描结果</h2>
    <div id="results" class="muted">尚未扫描。</div>
  </div>

  <div class="card">
    <h2>操作原则</h2>
    <p>先对找到的候选数据点“下载 JSON”，确认文件已保存，再考虑“恢复到 v5.6.1”。不要先清除 Safari 网站数据，也不要先导入旧备份覆盖。</p>
  </div>
</main>

<script>
const CURRENT_KEY = 'word_recall_pwa_state_v5_6_1';
const KNOWN_KEYS = [
  'word_recall_pwa_state_v5_6_1',
  'word_recall_pwa_state_v5_6',
  'word_recall_pwa_state_v5_5_beta',
  'vocab_mvp_data_v1'
];
const DB_NAME = 'word_recall_pwa_db';
const DB_VERSION = 2;
const STORE_APP = 'app';
const APP_STATE_KEY = 'state';

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseState(raw){
  try {
    const value = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!value || typeof value !== 'object') return {ok:false,error:'不是有效对象'};
    const words = Array.isArray(value.words) ? value.words : [];
    const logs = Array.isArray(value.logs) ? value.logs : [];
    const wrongBook = Array.isArray(value.wrongBook) ? value.wrongBook : [];
    const settings = value.settings || {};
    return {
      ok:true, value,
      words:words.length,
      logs:logs.length,
      wrong:wrongBook.length,
      quota:settings.dailyQuota,
      intervals:Array.isArray(settings.intervals) ? settings.intervals.join(',') : '未知'
    };
  } catch(e){ return {ok:false,error:e.message}; }
}
function downloadJSON(name, value){
  const blob = new Blob([JSON.stringify(value,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE_APP)) db.createObjectStore(STORE_APP);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error || new Error('IndexedDB 打开失败'));
  });
}
async function readIDB(){
  const db=await openDB();
  try{
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(STORE_APP,'readonly');
      const req=tx.objectStore(STORE_APP).get(APP_STATE_KEY);
      req.onsuccess=()=>resolve(req.result ?? null);
      req.onerror=()=>reject(req.error || new Error('IndexedDB 读取失败'));
    });
  } finally { db.close(); }
}
function allRelevantLSKeys(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && (k.includes('word_recall') || k.includes('vocab_mvp') || KNOWN_KEYS.includes(k))) keys.push(k);
  }
  return [...new Set([...KNOWN_KEYS,...keys])];
}
function renderCandidate(container, source, parsed, rawValue){
  const div=document.createElement('div');
  div.className='candidate '+(!parsed.ok?'bad':parsed.words>0?'good':'empty');
  if(!parsed.ok){
    div.innerHTML=`<strong>${esc(source)}</strong><p>无法解析：${esc(parsed.error)}</p>`;
    container.appendChild(div); return;
  }
  div.innerHTML=`
    <strong>${esc(source)}</strong>
    <div class="stats">
      <span class="pill">词库 ${parsed.words}</span>
      <span class="pill">错词 ${parsed.wrong}</span>
      <span class="pill">记录 ${parsed.logs}</span>
      <span class="pill">每日新词 ${esc(parsed.quota ?? '未知')}</span>
      <span class="pill">间隔 ${esc(parsed.intervals)}</span>
    </div>
    <button class="download">先下载此候选 JSON</button>
    <button class="restore danger">恢复到 v5.6.1 当前键</button>
    <details><summary>查看少量预览</summary><pre>${esc(JSON.stringify(rawValue,null,2).slice(0,3000))}</pre></details>
  `;
  div.querySelector('.download').onclick=()=>downloadJSON(
    `word_recall_recovered_${source.replace(/[^a-zA-Z0-9_-]+/g,'_')}.json`, rawValue
  );
  div.querySelector('.restore').onclick=()=>{
    if(!confirm(`将“${source}”写入 ${CURRENT_KEY}。请确认你已经先下载了该候选 JSON。继续吗？`)) return;
    try{
      localStorage.setItem(CURRENT_KEY, JSON.stringify(rawValue));
      alert('已写入恢复数据。现在请关闭本页，再打开原单词程序检查。若不正确，不要继续录词。');
    }catch(e){ alert('恢复写入失败：'+e.message); }
  };
  container.appendChild(div);
}
async function scan(){
  const status=document.getElementById('status');
  const results=document.getElementById('results');
  status.textContent='扫描中…'; results.innerHTML='';
  let found=0;
  for(const key of allRelevantLSKeys()){
    const raw=localStorage.getItem(key);
    if(raw===null) continue;
    found++;
    renderCandidate(results, 'localStorage: '+key, parseState(raw), parseState(raw).ok ? parseState(raw).value : raw);
  }
  try{
    const idb=await readIDB();
    if(idb!==null){
      found++;
      renderCandidate(results, 'IndexedDB: word_recall_pwa_db / app / state', parseState(idb), idb);
    }
  }catch(e){
    const d=document.createElement('div');
    d.className='candidate bad';
    d.innerHTML=`<strong>IndexedDB</strong><p>读取失败：${esc(e.message)}</p>`;
    results.appendChild(d);
  }
  if(!found) results.innerHTML='<p>没有找到任何候选状态。若之前删除过该站点的网站数据，本机旧数据可能已被系统删除。</p>';
  status.textContent='扫描完成';
}
document.getElementById('scanBtn').onclick=scan;
</script>
</body>
</html>
